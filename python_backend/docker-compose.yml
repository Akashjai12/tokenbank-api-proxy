version: '3.8'

services:
  tokenbank-api:
    build: .
    container_name: tokenbank_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPSTREAM_API_BASE=https://generativelanguage.googleapis.com/v1beta/openai
      - UPSTREAM_API_KEY=${GEMINI_API_KEY:-}
      - UPSTREAM_DEFAULT_MODEL=gemini-3.8-flash
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: tokenbank_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
